<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat app</title>
    <style>
        /* General styles */
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #4facfe, #00f2fe) fixed;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background: #fff;
            padding: 20px 30px;
            border-radius: 10px;
            box-shadow: 0 6px 10px rgba(0, 0, 0, 0.15);
            max-width: 400px;
            width: 100%;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
            color: #555;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
            box-sizing: border-box;
        }

        input:focus {
            outline: none;
            border-color: #4facfe;
            box-shadow: 0 0 5px rgba(79, 172, 254, 0.5);
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: #4facfe;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: background 0.3s;
        }

        button:hover {
            background-color: #00c6ff;
        }

        .error {
            color: red;
            font-size: 14px;
        }

        .link {
            text-align: center;
            margin-top: 10px;
        }

        .link a {
            color: #4facfe;
            text-decoration: none;
        }

        .link a:hover {
            text-decoration: underline;
        }

        /* Loading screen styles */
        #loadingOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(255, 255, 255, 0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        #spinner {
            border: 8px solid #f3f3f3;
            border-top: 8px solid #3498db;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 2s linear infinite;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>
<body>
<div id="loadingOverlay">
    <div id="spinner"></div>
</div>

<div class="container">
    <h1>Chat app</h1>
    <form id="loginForm" action="/login" method="POST">
        <label for="username">Username or Email address :</label>
        <input type="text" id="username" name="username" placeholder="Enter your username or email" required>

        <label for="password">Password :</label>
        <input type="password" id="password" name="password" placeholder="Enter your password" required>

        <div id="errorMessage" class="error" style="display: none;"></div>

        <button type="submit">Connect</button>
    </form>
    <div class="link">
        <p>Don't have an account ? <a href="/register">Register here</a></p>
        <p>Send a message without an account ? <a href="/sendMessage">Click here</a></p>
    </div>
</div>

<script>
    document.getElementById("loginForm").addEventListener("submit", function (event) {
        event.preventDefault();

        const username = document.getElementById("username").value;
        const password = document.getElementById("password").value;
        const errorMessage = document.getElementById("errorMessage");
        const loadingOverlay = document.getElementById("loadingOverlay");
        loadingOverlay.style.display = "flex";

        // Reset the error message
        errorMessage.textContent = "";

        // client-side validation
        if (!username.includes("@") && username.length < 3) {
            errorMessage.style.display = "block";
            errorMessage.textContent = "Please enter a valid username or email.";
            loadingOverlay.style.display = "none";
            return;
        }
        if (!password.includes("@") && password.length < 3) {
            errorMessage.style.display = "block";
            errorMessage.textContent = "Please enter a valid password.";
            loadingOverlay.style.display = "none";
            return;
        }

        const formData = new FormData(this);
        fetch("/login", {
            method: "POST",
            body: formData
        })
            .then(response => response.json())
            .then(data => {
                const feedback = document.getElementById("errorMessage");
                feedback.style.display = "block";
                if (!data.success) {
                    feedback.textContent = data.message;
                    loadingOverlay.style.display = "none";
                } else {
                    feedback.textContent = "Login successful!";
                    feedback.style.color = "green";
                    window.location.href = "/messages";
                    setTimeout(() => {
                        loadingOverlay.style.display = "none";
                    }, 10000);
                }
            })
            .catch(error => {
                console.error("Error:", error);
                loadingOverlay.style.display = "none";
            });
    });
</script>
</body>
</html>

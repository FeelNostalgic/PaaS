<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New game</title>
    <link type="text/css" rel="stylesheet" href="{{ url_for('static', filename='css/header.css') }}">
    <link type="text/css" rel="stylesheet" href="{{ url_for('static', filename='css/body.css') }}">
    <link type="text/css" rel="stylesheet" href="{{ url_for('static', filename='css/feedback.css') }}">

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css"/>

    <style>
        .container {
            background: #fff;
            padding: 20px 30px;
            border-radius: 10px;
            box-shadow: 0 6px 10px rgba(0, 0, 0, 0.15);
            max-width: 1500px;
            width: 100%;
            height: 80%;
            margin-top: 80px;
            display: flex;
            flex: 1;
        }

        #map {
            width: 50%;
            height: 100%;
        }

        .sidebar {
            width: 50%;
            height: 96%;
            display: flex;
            flex-direction: column;
            background-color: #f9f9f9;
            padding: 20px;
            box-shadow: -2px 0 5px rgba(0, 0, 0, 0.1);
        }

        .sidebar .marker-list {
            flex: 1;
            overflow-y: auto;
            margin-top: 20px;
        }

        .sidebar .marker-item {
            padding: 10px;
            border-bottom: 1px solid #ddd;
        }

        .sidebar .marker-item input,
        .sidebar .marker-item textarea {
            width: calc(100% - 20px);
            margin-bottom: 10px;
        }

        .sidebar .marker-item img {
            max-width: 50%;
            margin-bottom: 10px;
        }

        .sidebar .actions {
            text-align: right;
            margin-top: 20px;
        }

        .sidebar .actions button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            background-color: #4facfe;
            color: white;
            border: none;
            border-radius: 5px;
            transition: background 0.3s;
        }

        .sidebar .actions button:hover {
            background-color: #00c6ff;
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: #4facfe;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: background 0.3s;
            margin-bottom: 10px;
        }

        .incomplete-marker {
            border: 2px solid red;
            padding: 5px;
            margin-bottom: 5px;
            background-color: #ffe6e6;
        }

        .warning {
            color: red;
            font-weight: bold;
            font-size: 12px;
            padding: 0;
        }

    </style>
</head>
<body>

<div id="feedbackDiv">
    <div id="feedback" class="feedback"></div>
</div>

<!-- Header Section -->
<div class="header">
    <div class="left">
        <span class="username">{{ session.userinfo.given_name }}</span>
    </div>

    <div class="center">
        <button class="navigation" onclick="window.location.href='/my_games'">Hunt Creations</button>
        <button class="navigation" onclick="window.location.href='/user_games'">Hunt</button>
        <button class="navigation" onclick="window.location.href='/home'">Global hunts</button>
        <button class="navigation" onclick="window.location.href='/new_game'">Plan a hunt</button>
    </div>
    <div class="right">
        <a href="/logout" class="logout-link">Logout</a>
    </div>
</div>

<!-- Main Content -->
<div class="container">
    <div id="map"></div>

    <div class="sidebar">
        <p id="gameName">{{ game.name }}</p>

        <h3>Caches</h3>
        <div class="marker-list" id="markerList">
            {% for cache in game.markers %}
                <div class="marker-item">
                    <p>{{ cache.clueText }}</p>
                </div>
            {% endfor %}
        </div>

        <div class="actions">
            <button onclick="window.location.href='/participate/{{ game.id }}'">Participate</button>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
    <script>
        var markers = []; // Array to store markers with their data

        function initMap() {
            var latLngBounds = [
                [{{ game.area.lat1 }}, {{ game.area.lon1 }}],
                [{{ game.area.lat2 }}, {{ game.area.lon2 }}]
            ];

            var lat = ({{ game.area.lat1 }} + {{ game.area.lat2 }}) / 2;
            var lon = ({{ game.area.lon1 }} + {{ game.area.lon2 }}) / 2;
            var map = L.map('map',
                {
                    zoomControl: false,
                    attributionControl: false
                })
                .setView([lat, lon], 13);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
            }).addTo(map);
            L.rectangle(latLngBounds).addTo(map);
            map.fitBounds(latLngBounds);
        }

        window.onload = initMap;

        function showFeedback(message, duration = 1500, isError = false) {
            const feedback = document.getElementById("feedback");

            feedback.textContent = message;

            if (isError) {
                feedback.classList.add("error");
            } else {
                feedback.classList.remove("error");
            }

            feedback.classList.add("show");

            setTimeout(() => {
                feedback.classList.remove("show");
            }, duration);
        }
    </script>
</div>
</body>
</html>

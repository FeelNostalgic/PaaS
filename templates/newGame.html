<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New game</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css"/>

    <style>
        /* General Styles */
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #4facfe, #00f2fe) fixed;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            height: 100vh;
        }

        .header {
            width: 95%;
            background-color: #fff;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1000;
            border-bottom: 1px solid #e0e0e0;
            padding: 10px 40px;
            border-bottom: 1px solid #e0e0e0;
        }

        .header .left {
            flex: 1;
            text-align: left;
            font-size: 16px;
            font-weight: bold;
            color: #333;
            margin-right: 10px;
        }

        .header .center {
            flex: 2;
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        .header .center .navigation {
            margin: 0 10px;
            padding: 8px 16px;
            font-size: 14px;
            color: white;
            background-color: #4facfe;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .header .center .navigation:hover {
            background-color: #00c6ff;
        }

        .header .right {
            flex: 1;
            text-align: right;
        }

        .header .right .logout-link {
            font-size: 14px;
            color: #dc3545;
            text-decoration: none;
            font-weight: bold;
            transition: color 0.3s ease;
        }

        .header .right .logout-link:hover {
            color: #a71d2a;
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: #4facfe;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: background 0.3s;
            margin-bottom: 10px;
        }

        button:hover {
            background-color: #00c6ff;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }

        .container {
            background: #fff;
            padding: 20px 30px;
            border-radius: 10px;
            box-shadow: 0 6px 10px rgba(0, 0, 0, 0.15);
            max-width: 1500px;
            width: 100%;
            height: 80%;
            margin-top: 80px;
            display: flex;
            flex: 1;
        }

        #map {
            width: 50%;
            height: 100%;
        }

        .sidebar {
            width: 50%;
            height: 96%;
            display: flex;
            flex-direction: column;
            background-color: #f9f9f9;
            padding: 20px;
            box-shadow: -2px 0 5px rgba(0, 0, 0, 0.1);
        }

        .sidebar .marker-list {
            flex: 1;
            overflow-y: auto;
            margin-top: 20px;
        }

        .sidebar .marker-item {
            padding: 10px;
            border-bottom: 1px solid #ddd;
        }

        .sidebar .marker-item input,
        .sidebar .marker-item textarea {
            width: calc(100% - 20px);
            margin-bottom: 10px;
        }

        .sidebar .marker-item img {
            max-width: 50%;
            margin-bottom: 10px;
        }

        .sidebar .actions {
            text-align: right;
            margin-top: 20px;
        }

        .sidebar .actions button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            background-color: #4facfe;
            color: white;
            border: none;
            border-radius: 5px;
            transition: background 0.3s;
        }

        .sidebar .actions button:hover {
            background-color: #00c6ff;
        }

    </style>
</head>
<body>

<!-- Header Section -->
<div class="header">
    <div class="left">
        <span class="username">{{ session.userinfo.given_name }}</span>
    </div>

    <div class="center">
        <button class="navigation" onclick="window.location.href='/my_games'">My games</button>
        <button class="navigation" onclick="window.location.href='/home'">Games</button>
        <button class="navigation" onclick="window.location.href='/new_game'">Create new game</button>
    </div>
    <div class="right">
        <a href="/logout" class="logout-link">Logout</a>
    </div>
</div>

<!-- Main Content -->
<div class="container">
    <div id="map"></div>

    <div class="sidebar">
        <label for="gameName">Game Name:</label>
        <input type="text" id="gameName" placeholder="Enter game name" required>

        <div class="marker-list" id="markerList">
            <!-- Markers will be dynamically added here -->
        </div>

        <div class="actions">
            <button onclick="saveGame()">Save Game</button>
        </div>
    </div>


    <!-- Incluir Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
    <!-- Incluir Leaflet Draw JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>

    <script>
        var map = L.map('map'); //Empty map
        var isAreaCreated = false;
        var lat1, lon1, lat2, lon2 = 0;
        var latMin, latMax, lngMin, lngMax = 0;

        // Draw tools
        var drawnItems = new L.FeatureGroup();
        map.addLayer(drawnItems);

        // Only draw rectangles
        var drawControl = new L.Control.Draw({
            edit: {
                featureGroup: drawnItems
            },
            draw: {
                rectangle: true,
                polygon: false,
                polyline: false,
                circle: false,
                marker: true,
                circlemarker: false
            }
        });

        map.addControl(drawControl);

        var markers = []; // Array to store markers with their data

        map.on('draw:created', function (event) {
            if (isAreaCreated) {
                var layer = event.layer;
                if (layer instanceof L.Marker) { //Add cache marker
                    var lat = layer.getLatLng().lat;
                    var lng = layer.getLatLng().lng;
                    if (lat >= latMin && lat <= latMax && lng >= lngMin && lng <= lngMax) //Inside the area
                    {
                        var markerData = {
                            id: L.stamp(layer), // Unique ID for the marker
                            lat: layer.getLatLng().lat,
                            lng: layer.getLatLng().lng,
                            clueText: "",
                            clueImage: null,
                            layer: layer
                        };
                        markers.push(markerData);
                        drawnItems.addLayer(layer);

                        layer.on('click', function () {
                            updateMarkerPopup(markerData);
                            layer.openPopup();
                        });

                        updateMarkerList();
                    }
                    //TODO: notify out of area
                }
            } else {
                var layer = event.layer;
                if (layer instanceof L.Rectangle) { // Add area

                    drawnItems.addLayer(layer);

                    var bounds = layer.getBounds();
                    lat1 = bounds.getSouthWest().lat;
                    lon1 = bounds.getSouthWest().lng;
                    lat2 = bounds.getNorthEast().lat;
                    lon2 = bounds.getNorthEast().lng;

                    latMin = Math.min(lat1, lat2);
                    latMax = Math.max(lat1, lat2);
                    lngMin = Math.min(lon1, lon2);
                    lngMax = Math.max(lon1, lon2);

                    isAreaCreated = true;

                } else {
                    // TODO: notificar area no creada al intentar poner marker
                }
            }
        });

        function updateMarkerPopup(markerData) {
            var content = `
            <p><b>ID:</b> ${markerData.id}</p>
            <p><b>Position:</b> (${markerData.lat.toFixed(6)}, ${markerData.lng.toFixed(6)})</p>
            <p><b>Clue Text:</b> ${markerData.clueText || 'None'}</p>
            ${markerData.clueImage ? `<img src="${markerData.clueImage}" alt="Clue Image" style="max-width: 200px;">` : ''}`;
            markerData.layer.unbindPopup(); // Remove any existing popup
            markerData.layer.bindPopup(content); // Bind the updated popup
        }

        function updateMarkerList() {
            var markerList = document.getElementById('markerList');
            markerList.innerHTML = ""; // Clear current list
            markers.forEach((marker, index) => {
                var markerItem = document.createElement('div');
                markerItem.className = 'marker-item';
                markerItem.innerHTML = `
                <p>Marker ${index + 1}: (${marker.lat.toFixed(6)}, ${marker.lng.toFixed(6)})</p>
                <label>Clue Text:</label>
                <textarea rows="3" onchange="updateClueText(${index}, this.value)">${marker.clueText}</textarea>
                <label>Clue Image:</label>
                <input type="file" accept="image/*" onchange="updateClueImage(${index}, this)">
                ${marker.clueImage ? `<img src="${marker.clueImage}" alt="Clue Image">` : ''}
            `;
                markerList.appendChild(markerItem);
            });
        }

        function updateClueText(index, text) {
            markers[index].clueText = text;
        }

        function updateClueImage(index, input) {
            var reader = new FileReader();
            reader.onload = function (e) {
                markers[index].clueImage = e.target.result;
                updateMarkerList();
            };
            reader.readAsDataURL(input.files[0]);
        }

        map.on('draw:edited', function (event) {
            var layers = event.layers;

            layers.eachLayer(function (layer) {
                if (layer instanceof L.Marker) {
                    var markerId = L.stamp(layer);
                    var marker = markers.find(m => m.id === markerId);
                    if (marker) {
                        marker.lat = layer.getLatLng().lat;
                        marker.lng = layer.getLatLng().lng;
                    }
                }

                if (layer instanceof L.Rectangle) {
                    var bounds = layer.getBounds();
                    lat1 = bounds.getSouthWest().lat;
                    lon1 = bounds.getSouthWest().lng;
                    lat2 = bounds.getNorthEast().lat;
                    lon2 = bounds.getNorthEast().lng;

                    latMin = Math.min(lat1, lat2);
                    latMax = Math.max(lat1, lat2);
                    lngMin = Math.min(lon1, lon2);
                    lngMax = Math.max(lon1, lon2);
                }
            });

            updateMarkerList();
        });

        map.on('draw:deleted', function (event) {
            var layers = event.layers;

            layers.eachLayer(function (layer) {
                if (layer instanceof L.Marker) {
                    var markerId = L.stamp(layer);
                    markers = markers.filter(m => m.id !== markerId);
                }

                if (layer instanceof L.Rectangle) {
                    lat1 = 0;
                    lon1 = 0;
                    lat2 = 0;
                    lon2 = 0;
                    isAreaCreated = false;
                }
            });
            updateMarkerList();
        });

        // Localize the user and generate map
        function locateUser() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(function (position) {
                    var lat = position.coords.latitude;
                    var lon = position.coords.longitude;

                    initMap(lat, lon);

                    L.marker([lat, lon]).addTo(map)
                        .bindPopup("You are here")
                        .openPopup();
                }, function (error) {
                    console.log("Error al obtener la ubicación: " + error.message);
                });
            } else {
                alert("Geolocalización no es soportada por este navegador.");
            }
        }

        function initMap(latitude, longitude) {
            map.setView([latitude, longitude], 13);

            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
            }).addTo(map);
        }

        window.onload = locateUser;

        function saveGame() {
            var gameName = document.getElementById('gameName').value;

            if (!gameName) {
                alert("Please enter a game name.");
                return;
            }

            if (lat1 === 0 || lon1 === 0 || lat2 === 0 || lon2 === 0) {
                alert("Please set an area for the game.");
                return;
            }

            if (markers.length === 0) {
                alert("Please add at least one marker.");
                return;
            }

            var data = {
                gameName: gameName,
                area: {
                    lat1: lat1,
                    lon1: lon1,
                    lat2: lat2,
                    lon2: lon2
                },
                markers: []
            };

            markers.forEach(marker => {
                data.markers.push({
                    id: marker.id,
                    lat: marker.lat,
                    lng: marker.lng,
                    clueText: marker.clueText,
                    clueImage: marker.clueImage
                });
            });

            fetch('/add_game', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(data)
            })
                .then(response => response.json())
                .then(data => {
                    console.log('Datos enviados correctamente:', data);
                    window.location.href = '/home';
                })
                .catch(error => {
                    console.error('Error al enviar los datos:', error);
                });
        }
    </script>
</div>
</body>
</html>

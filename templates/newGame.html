{% extends "base.html" %}
{% block head %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New game</title>
    <style>
        .container {
            background: #fff;
            padding: 20px 30px;
            border-radius: 10px;
            box-shadow: 0 6px 10px rgba(0, 0, 0, 0.15);
            max-width: 1500px;
            width: 100%;
            height: 80%;
            margin-top: 80px;
            display: flex;
            flex: 1;
        }

        #map {
            width: 50%;
            height: 100%;
        }

        .sidebar {
            width: 50%;
            height: 96%;
            display: flex;
            flex-direction: column;
            background-color: #f9f9f9;
            padding: 20px;
            box-shadow: -2px 0 5px rgba(0, 0, 0, 0.1);
        }

        .sidebar .marker-list {
            flex: 1;
            overflow-y: auto;
            margin-top: 20px;
        }

        .sidebar .marker-item {
            padding: 10px;
            border-bottom: 1px solid #ddd;
        }

        .sidebar .marker-item input,
        .sidebar .marker-item textarea {
            width: calc(100% - 20px);
            margin-bottom: 10px;
        }

        .sidebar .marker-item img {
            max-width: 50%;
            margin-bottom: 10px;
        }

        .sidebar .actions {
            text-align: right;
            margin-top: 20px;
        }

        .sidebar .actions button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            background-color: #4facfe;
            color: white;
            border: none;
            border-radius: 5px;
            transition: background 0.3s;
        }

        .sidebar .actions button:hover {
            background-color: #00c6ff;
        }

        .actions button {
            width: 100%;
            padding: 10px;
            background-color: #4facfe;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: background 0.3s;
            margin-bottom: 10px;
        }

        .delete-photo-btn {
            display: none;
        }

        .incomplete-marker {
            border: 2px solid red;
            padding: 5px;
            margin-bottom: 5px;
            background-color: #ffe6e6;
        }

        .warning {
            color: red;
            font-weight: bold;
            font-size: 12px;
            padding: 0;
        }

    </style>
{% endblock %}
{% block body %}
    <!-- Main Content -->
    <div class="container">
        <div id="map"></div>

        <div class="sidebar">
            <label for="gameName">Game Name:</label>
            <input type="text" id="gameName" placeholder="Enter game name" required>

            <div class="marker-list" id="markerList">
                <!-- Markers will be dynamically added here -->
            </div>

            <div class="actions">
                <button onclick="saveGame()">Save Game</button>
            </div>
        </div>


        <!-- Incluir Leaflet JS -->
        <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
        <!-- Incluir Leaflet Draw JS -->
        <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>

        <script>
            var map = L.map('map'); //Empty map
            var isAreaCreated = false;
            var lat1, lon1, lat2, lon2 = 0;
            var latMin, latMax, lngMin, lngMax = 0;

            // Draw tools
            var drawnItems = new L.FeatureGroup();
            map.addLayer(drawnItems);

            // Only draw rectangles
            var drawControl = new L.Control.Draw({
                edit: {
                    featureGroup: drawnItems
                },
                draw: {
                    rectangle: true,
                    polygon: false,
                    polyline: false,
                    circle: false,
                    marker: true,
                    circlemarker: false
                }
            });

            map.addControl(drawControl);

            var markers = []; // Array to store markers with their data

            map.on('draw:created', function (event) {
                if (isAreaCreated) {
                    var layer = event.layer;
                    if (layer instanceof L.Marker) { //Add cache marker
                        var lat = layer.getLatLng().lat;
                        var lng = layer.getLatLng().lng;
                        if (lat >= latMin && lat <= latMax && lng >= lngMin && lng <= lngMax) //Inside the area
                        {
                            var markerData = {
                                id: L.stamp(layer), // Unique ID for the marker
                                lat: layer.getLatLng().lat,
                                lng: layer.getLatLng().lng,
                                clueText: "",
                                clueImage: null,
                                layer: layer
                            };
                            markers.push(markerData);
                            drawnItems.addLayer(layer);

                            layer.on('click', function () {
                                updateMarkerPopup(markerData);
                                layer.openPopup();
                            });

                            updateMarkerList();
                        } else {
                            showFeedback("Marker outside the area", true);
                        }
                    } else {
                        showFeedback("Area is already created", true);
                    }
                } else {
                    var layer = event.layer;
                    if (layer instanceof L.Rectangle) { // Add area

                        drawnItems.addLayer(layer);

                        var bounds = layer.getBounds();
                        lat1 = bounds.getSouthWest().lat;
                        lon1 = bounds.getSouthWest().lng;
                        lat2 = bounds.getNorthEast().lat;
                        lon2 = bounds.getNorthEast().lng;

                        latMin = Math.min(lat1, lat2);
                        latMax = Math.max(lat1, lat2);
                        lngMin = Math.min(lon1, lon2);
                        lngMax = Math.max(lon1, lon2);

                        isAreaCreated = true;

                    } else {
                        showFeedback("Please create an area first", true);
                    }
                }
            });

            function updateMarkerPopup(markerData) {
                var content = `
            <p><b>ID:</b> ${markerData.id}</p>
            <p><b>Position:</b> (${markerData.lat.toFixed(6)}, ${markerData.lng.toFixed(6)})</p>
            <p><b>Clue Text:</b> ${markerData.clueText || 'None'}</p>
            ${markerData.clueImage ? `<img src="${markerData.clueImage}" alt="Clue Image" style="max-width: 200px;">` : ''}`;
                markerData.layer.unbindPopup();
                markerData.layer.bindPopup(content);
            }

            function updateMarkerList(warning = false) {
                var markerList = document.getElementById('markerList');
                markerList.innerHTML = ""; // Clear current list

                markers.forEach((marker, index) => {
                    var markerItem = document.createElement('div');
                    markerItem.className = 'marker-item';

                    var missingClueText = !marker.clueText || marker.clueText.trim() === '';
                    var missingClueImage = !marker.clueImage;

                    var warningClueText = '';
                    var warningClueImage = '';
                    if (warning) {
                        if (missingClueText && missingClueImage) {
                            markerItem.classList.add('incomplete-marker');
                            warningClueText = `
                        <p class="warning">
                             ${missingClueText ? "Clue Text is missing. " : ""}
                        </p>
                            `;
                            markerItem.classList.add('incomplete-marker');
                            warningClueImage = `
                        <p class="warning">
                            ${missingClueImage ? "Clue Image is missing." : ""}
                        </p>
                    `;
                        }
                    }
                    markerItem.innerHTML = `
                    <p>Marker ${index + 1}: (${marker.lat.toFixed(6)}, ${marker.lng.toFixed(6)})</p>
                    <label>Clue Text:</label>
                    <textarea rows="3" onchange="updateClueText(${index}, this.value)">${marker.clueText || ''}</textarea>
                    ${warningClueText}
                    <label>Clue Image:</label>
                    <input type="file" accept="image/*" onchange="updateClueImage(${index}, this)">
                     ${marker.clueImage ? `
                        <div>
                            <img src="${marker.clueImage}" alt="Clue Image" style="max-width: 300px; max-height: 300px; margin-top: 10px; display: block;">
                             <button type="button" onclick="removeClueImage(${index})" style="margin-top: 10px; background-color: red; color: white; display: block;">Remove Image</button>
                        </div>
                    ` : ''}
                    ${warningClueImage}                    `;
                    markerList.appendChild(markerItem);
                });
            }

            function updateClueText(index, text) {
                markers[index].clueText = text;
            }

            function updateClueImage(index, input) {
                var reader = new FileReader();
                reader.onload = function (e) {
                    markers[index].clueImage = e.target.result;
                    updateMarkerList();
                };
                reader.readAsDataURL(input.files[0]);
            }

            function removeClueImage(index) {
                markers[index].clueImage = null;
                updateMarkerList();
            }

            map.on('draw:edited', function (event) {
                var layers = event.layers;

                markersToRemove = [];
                layers.eachLayer(function (layer) {
                    if (layer instanceof L.Marker) {
                        var markerId = L.stamp(layer);
                        var marker = markers.find(m => m.id === markerId);
                        var lat = layer.getLatLng().lat;
                        var lng = layer.getLatLng().lng;
                        if (lat >= latMin && lat <= latMax && lng >= lngMin && lng <= lngMax) //Inside the area
                        {
                            if (marker) {
                                marker.lat = lat;
                                marker.lng = lng;
                            }
                        } else {
                            markersToRemove.push(marker);
                        }
                    }

                    if (layer instanceof L.Rectangle) {
                        var bounds = layer.getBounds();
                        lat1 = bounds.getSouthWest().lat;
                        lon1 = bounds.getSouthWest().lng;
                        lat2 = bounds.getNorthEast().lat;
                        lon2 = bounds.getNorthEast().lng;

                        latMin = Math.min(lat1, lat2);
                        latMax = Math.max(lat1, lat2);
                        lngMin = Math.min(lon1, lon2);
                        lngMax = Math.max(lon1, lon2);

                        for (var i = 0; i < markers.length; i++) {
                            var marker = markers[i];
                            var lat = marker.lat;
                            var lng = marker.lng;
                            if (!(lat >= latMin && lat <= latMax && lng >= lngMin && lng <= lngMax)) //Inside the area
                            {
                                markersToRemove.push(marker);
                            }
                        }
                    }
                });


                markersToRemove.forEach(marker => {
                    showFeedback(`
                Markers outside the area will be removed
                    `, true);
                    marker.layer.setOpacity(0);
                    markers = markers.filter(m => m.id !== marker.id);
                });

                updateMarkerList();
            });

            map.on('draw:deleted', function (event) {
                var layers = event.layers;

                layers.eachLayer(function (layer) {
                    if (layer instanceof L.Marker) {
                        var markerId = L.stamp(layer);
                        markers = markers.filter(m => m.id !== markerId);
                    }

                    if (layer instanceof L.Rectangle) {
                        lat1 = 0;
                        lon1 = 0;
                        lat2 = 0;
                        lon2 = 0;
                        isAreaCreated = false;
                        drawnItems.clearLayers();
                        markers = [];
                    }
                });
                updateMarkerList();
            });

            // Localize the user and generate map
            function locateUser() {
                if (navigator.geolocation) {
                    navigator.geolocation.getCurrentPosition(function (position) {
                        var lat = position.coords.latitude;
                        var lon = position.coords.longitude;

                        initMap(lat, lon);

                        L.marker([lat, lon]).addTo(map)
                            .bindPopup("You are here")
                            .openPopup();
                    }, function (error) {
                        console.log("Error al obtener la ubicación: " + error.message);
                    });
                } else {
                    showFeedback("Geolocalización no es soportada por este navegador.", true);
                }
            }

            function initMap(latitude, longitude) {
                map.setView([latitude, longitude], 13);

                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
                }).addTo(map);
            }

            window.onload = locateUser;

            function saveGame() {
                var gameName = document.getElementById('gameName').value;

                if (!gameName) {
                    showFeedback("Please enter a game name.", true);
                    return;
                }

                if (lat1 === 0 || lon1 === 0 || lat2 === 0 || lon2 === 0) {
                    showFeedback("Please create an area for the game.", true);
                    return;
                }

                if (markers.length === 0) {
                    showFeedback("Please add at least one marker.", true);
                    return;
                }

                updateMarkerList(true);

                for (let marker of markers) {
                    if (!marker.clueText && !marker.clueImage) {
                        showFeedback("Each marker must have at least a clue text or image.", true);
                        return;
                    }
                }

                showLoadingOverlay();

                var data = {
                    gameName: gameName,
                    area: {
                        lat1: lat1,
                        lon1: lon1,
                        lat2: lat2,
                        lon2: lon2
                    },
                    markers: []
                };

                markers.forEach(marker => {
                    data.markers.push({
                        id: marker.id,
                        lat: marker.lat,
                        lng: marker.lng,
                        clueText: marker.clueText,
                        clueImage: marker.clueImage
                    });
                });

                fetch('/add_game', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(data)
                })
                    .then(response => response.json())
                    .then(data => {
                        if (!data.error) {
                            showFeedback(data.message);
                            setTimeout(() => {
                                window.location.href = '/home';
                            }, 1500);
                        } else {
                            showFeedback(data.message, true);
                            hideLoadingOverlay();
                        }
                    })
                    .catch(error => {
                        showFeedback("Error when sending data", true);
                    });
            }
        </script>
    </div>
{% endblock %}
